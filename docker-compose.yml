services:
    # 1. Container PHP-FPM (Mesin Aplikasi Laravel)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: presentify-app
        working_dir: /var/www/html
        ports:
            - '5174:5173'
        volumes:
            - .:/var/www/html
            - presentify_vendor:/var/www/html/vendor
            - presentify_node_modules:/var/www/html/node_modules
        networks:
            - presentify-net
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started

    # 2. Container Nginx (Web Server)
    nginx:
        image: nginx:alpine
        container_name: presentify-nginx
        ports:
            - '80:80'
        volumes:
            - .:/var/www/html
            - presentify_vendor:/var/www/html/vendor
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - presentify-net
        depends_on:
            - app

    # 3. Container MySQL 8.0 (Database)
    db:
        image: mysql:8.0
        container_name: presentify-db
        command: --innodb-buffer-pool-size=128M --innodb-redo-log-capacity=32M
        ports:
            - '3308:3306'
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: presentify_db
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: secret
        volumes:
            - presentify_mysql_data:/var/lib/mysql
        networks:
            - presentify-net
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-psecret',
                ]
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 240s

    # 4. Container Redis (Cache & Queue)
    redis:
        image: redis:alpine
        container_name: presentify-redis
        networks:
            - presentify-net

networks:
    presentify-net:
        driver: bridge

volumes:
    presentify_mysql_data:
    presentify_vendor:
    presentify_node_modules:
