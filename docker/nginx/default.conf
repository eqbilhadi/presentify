server {
    listen 80;
    server_name presentify.test *.presentify.test localhost *.localhost;

    # 1. Arahkan root web ke folder /public milik Laravel (bukan root proyek!)
    root /var/www/html/public;
    index index.php index.html;

    # 2. Batas maksimal ukuran upload file
    client_max_body_size 20M;

    # 3. Routing SPA / Laravel: jika file fisik tidak ditemukan, teruskan ke index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Teruskan seluruh eksekusi file .php ke container PHP-FPM ('app:9000')
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 5. Blokir akses publik ke file tersembunyi seperti .env atau .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
